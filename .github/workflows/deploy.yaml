name: Bygg og deploy

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '.github/pr-test-parallell.yml'
      - '*.md'
      - '.run/*'
      - 'docker-compose.yaml'
  workflow_dispatch:
    inputs:
      cluster:
        description: Cluster
        required: true
        default: dev-gcp
        type: choice
        options:
          - dev-gcp
          - prod-gcp

jobs:
  build:
    name: Bygg og test og push
    runs-on: ubuntu-latest-8-cores
    permissions:
        contents: read
        id-token: write
        packages: write
        checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: 25
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
            gradle-version: wrapper
      - name: Bygg & test
        run: ./gradlew clean build --continue --stacktrace

      - uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: success() || failure()
        with:
          name: test
          path: "**/build/test-results/test/TEST-*.xml"
          reporter: java-junit
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6.5.0
        if: success() || failure() # always run even if the previous step fails
        with:
          report_paths: '**/build/test-results/test/TEST-*.xml'

      - name: Store reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
            name: reports
            path: |
                **/build/reports/
                **/build/test-results

      - uses: nais/docker-build-push@8e41f1f58749b9248e376c25d33bfbdd2b1163c0 # v0
        id: docker-push
        with:
            team: aap # required

    outputs:
        image: ${{ steps.docker-push.outputs.image }}

  bygg-docs:
    name: Bygg docs
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
        contents: read
        id-token: write
        packages: write
        checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: 25
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
            gradle-version: wrapper
      - name: Genererer docs
        run: |
          ./gradlew dokkaGenerate
      - name: upload-artifact for docs
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: './docs/build/dokka/html'


  deploy-pages:
    runs-on: ubuntu-latest
    needs: bygg-docs
    concurrency:
      group: docs
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.test.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1


  publiser-kontrakt:
      needs: build
      concurrency:
          group: kontrakt
          queue: max
      permissions:
          contents: write
          packages: write
          id-token: write
      runs-on: ubuntu-latest
      steps:
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            with:
                fetch-depth: 0
            #  Ha denne tidlig, så action kan skippe raskt om ingen endringer.
          - uses: paulhatch/semantic-version@502226b17e3e242e4befd0a45690fcbb27dd1373 # v6.0.3
            id: tag
            with:
                change_path: "kontrakt/"
                bump_each_commit: true
                tag_prefix: ""
                bump_each_commit_patch_pattern: ''
                major_pattern: "(MAJOR)" # If major bump, include this in the commit message
          - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
            if: ${{ steps.tag.outputs.version_type != 'none' }}
            with:
                java-version: 25
                distribution: 'temurin'
          - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
            with:
                gradle-version: wrapper
          - id: notes
            if: ${{ steps.tag.outputs.version_type != 'none' }}
            run: |
                randomDelimiter=${RANDOM}
                text=$(git --no-pager log $(git describe --tags --abbrev=0)..HEAD --pretty=format:"%h %s" | sed ':a;N;$!ba;s/\n/\n\n/g')
                echo 'CHANGELOG<<$randomDelimiter' >> $GITHUB_OUTPUT
                echo -e "$text" >> $GITHUB_OUTPUT
                echo '$randomDelimiter' >> $GITHUB_OUTPUT
          - if: ${{ steps.tag.outputs.version_type != 'none' }}
            env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            run: |
                ./gradlew -Pversion=${{ steps.tag.outputs.version }} publish
          - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
            if: ${{ steps.tag.outputs.version_type != 'none' }}
            id: create_release
            env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            with:
                tag_name: ${{ steps.tag.outputs.version }}
                name: ${{ steps.tag.outputs.version }}
                body: |
                    Endringer siden sist:
                    ${{ steps.notes.outputs.CHANGELOG }}                

  deploy-dev:
    needs: build
    runs-on: ubuntu-latest
    permissions:
        contents: read
        id-token: write
    concurrency:
      group: deploy-dev
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: nais/deploy/actions/deploy@027a91857992525139798892f2804b0ca21f4af6 # v2
        env:
          PRINT_PAYLOAD: true
          CLUSTER: dev-gcp
          RESOURCE: .nais/dev.yaml
          VAR: image=${{ needs.build.outputs.image }}

  deploy-prod:
      if: ${{ github.ref == 'refs/heads/main' }}
      needs: [publiser-kontrakt, deploy-dev, build]
      runs-on: ubuntu-latest
      concurrency:
        group: deploy-prod
        queue: max
      permissions:
          contents: read
          id-token: write
      steps:
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          - uses: nais/deploy/actions/deploy@027a91857992525139798892f2804b0ca21f4af6 # v2
            env:
                PRINT_PAYLOAD: true
                CLUSTER: prod-gcp
                RESOURCE: .nais/prod.yaml
                VAR: image=${{ needs.build.outputs.image }}
