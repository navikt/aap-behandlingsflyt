name: Pull Request

on:
    pull_request:
    workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.ref }}"
  cancel-in-progress: true

jobs:
    test:
        runs-on: ubuntu-latest-8-cores
        timeout-minutes: 25
        permissions:
            contents: read
            id-token: write
            packages: write
            checks: write
        strategy:
          fail-fast: false
          matrix:
            gradle_args: [":api:check", ":app:check", ":behandlingsflyt:check", ":kontrakt:check", ":lib-test:check", ":repository:check"]
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            -   uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
                with:
                    java-version: 25
                    distribution: 'temurin'

            - name: Setup Gradle for a non-wrapper project
              uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
              with:
                  gradle-version: wrapper
            - name: Bygg og test (${{matrix.gradle_args}})
              run: ./gradlew ${{matrix.gradle_args}} --continue --stacktrace
            - uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
              if: success() || failure()
              with:
                name: test
                path: "**/build/test-results/test/TEST-*.xml"
                reporter: java-junit
                token: ${{ secrets.GITHUB_TOKEN }}
            - name: Publish Test Report
              uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6.6.1
              if: success() || failure() # always run even if the previous step fails
              with:
                report_paths: '**/build/test-results/test/TEST-*.xml'
                check_name: 'JUnit Test Report for ${{ matrix.gradle_args }}'
                truncate_stack_traces: false
