name: Pull Request

on:
    pull_request:
    workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.ref }}"
  cancel-in-progress: true

jobs:
    test:
        runs-on: ubuntu-latest-8-cores
        timeout-minutes: 25
        permissions:
            contents: read
            id-token: write
            packages: write
            checks: write
        strategy:
          fail-fast: false
          matrix:
            gradle_args: [":api:check", ":app:check", ":behandlingsflyt:check", ":kontrakt:check", ":lib-test:check", ":repository:check"]
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            -   uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
                with:
                    java-version: 25
                    distribution: 'temurin'

            - name: Setup Gradle for a non-wrapper project
              uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
              with:
                  gradle-version: wrapper
            - name: Bygg og test (${{matrix.gradle_args}})
              run: ./gradlew ${{matrix.gradle_args}} --continue --stacktrace
            - uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
              if: success() || failure()
              with:
                name: test
                path: "**/build/test-results/test/TEST-*.xml"
                reporter: java-junit
                token: ${{ secrets.GITHUB_TOKEN }}
            - name: Publish Test Report
              uses: mikepenz/action-junit-report@d9f48fc87bc235f7e214acf696ca5abc0a986f16 # v6.4.2
              if: success() || failure() # always run even if the previous step fails
              with:
                report_paths: '**/build/test-results/test/TEST-*.xml'
                check_name: 'JUnit Test Report for ${{ matrix.gradle_args }}'
                truncate_stack_traces: false
